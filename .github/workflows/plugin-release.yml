name: Plugin release
on:
  pull_request:
  push:
    branches: [main, feature/plugin-release, feature/stable-plugin-updates]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q scripts hooks
      - run: python -m unittest discover -v
      - run: python scripts/package_plugin.py --output dist
      - run: python scripts/plugin_smoke.py --package dist/vince-gate-$(cat VERSION).zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vince-plugin-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
